port: 7880
redis:
  address: __REDIS_ADDRESS__
rtc:
  tcp_port: 7881
  port_range_start: 50000
  port_range_end: 60000
  use_external_ip: true
  node_ip: __NODE_IP__
  # EC2 cannot hairpin to its own EIP, so the STUN self-check would drop the public address.
  skip_external_ip_validation: true
keys:
  "__API_KEY__": "__API_SECRET__"
