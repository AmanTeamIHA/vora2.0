[project]
name = "vora-agent"
version = "0.1.0"
description = "Vora 2.0 LiveKit voice worker"
requires-python = ">=3.12,<3.13"
dependencies = [
    "contracts",
    "livekit-agents==1.8.9",
    "livekit-plugins-sarvam==1.8.9",
    "livekit-plugins-silero==1.8.9",
    "livekit-plugins-turn-detector==1.8.9",
    "redis>=5.2",
]

[tool.uv.sources]
contracts = { path = "../../packages/contracts" }

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vora_agent"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
