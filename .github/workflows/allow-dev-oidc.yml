name: allow-dev-oidc

on:
  pull_request:
    branches: [dev]
    paths:
      - ".github/workflows/allow-dev-oidc.yml"
      - "infra/scripts/allow-dev-oidc.py"

jobs:
  trust:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::585008088038:role/vora2-github-dev
          aws-region: ap-south-1
      - name: Allow refs/heads/dev for this repo
        run: python3 infra/scripts/allow-dev-oidc.py
