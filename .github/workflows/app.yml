name: app

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev]

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: vora
          POSTGRES_PASSWORD: vora
          POSTGRES_DB: vora
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vora -d vora"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Install
        working-directory: app/api
        run: uv sync --frozen
      - name: Lint
        working-directory: app/api
        run: uv run ruff check . && uv run ruff format --check .
      - name: Migrate
        working-directory: app/api
        env:
          DATABASE_URL: postgresql+psycopg://vora:vora@localhost:5432/vora
        run: uv run alembic upgrade head
      - name: Test
        working-directory: app/api
        env:
          APP_ENV: local
          DATABASE_URL: postgresql+psycopg://vora:vora@localhost:5432/vora
          APP_DATABASE_URL: postgresql+psycopg://vora_app:vora@localhost:5432/vora
          ADMIN_DATABASE_URL: postgresql+psycopg://vora_admin:vora@localhost:5432/vora
          REDIS_URL: redis://localhost:6379/0
          VORA_INTEGRATION: "1"
        run: uv run pytest

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/web/package-lock.json
      - name: Install
        working-directory: app/web
        run: npm ci
      - name: Lint
        working-directory: app/web
        run: npm run lint
      - name: Test
        working-directory: app/web
        run: npm test
      - name: Build
        working-directory: app/web
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
        run: npm run build

  livekit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: test_render
        working-directory: voice/livekit
        run: python -m unittest test_render.py

  deploy:
    needs: [api, web, livekit]
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::585008088038:role/vora2-github-dev
          aws-region: ap-south-1
      - name: Build and push images
        run: |
          set -eu
          reg=585008088038.dkr.ecr.ap-south-1.amazonaws.com
          aws ecr get-login-password --region ap-south-1 | docker login --username AWS --password-stdin "$reg"
          docker build -t "$reg/vora2-api:${GITHUB_SHA}" -t "$reg/vora2-api:bootstrap" app/api
          docker build \
            --build-arg NEXT_PUBLIC_API_URL=https://playground-dev.hellovora.ai/api \
            -t "$reg/vora2-web:${GITHUB_SHA}" -t "$reg/vora2-web:bootstrap" app/web
          docker push --all-tags "$reg/vora2-api"
          docker push --all-tags "$reg/vora2-web"
          chmod +x infra/scripts/deploy-dev.sh
          infra/scripts/deploy-dev.sh "$reg/vora2-api:${GITHUB_SHA}" "$reg/vora2-web:${GITHUB_SHA}"
