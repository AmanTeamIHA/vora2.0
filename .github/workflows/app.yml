name: app

on:
  pull_request:
  push:
    branches: [main]

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: vora
          POSTGRES_PASSWORD: vora
          POSTGRES_DB: vora
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vora -d vora"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Install
        working-directory: app/api
        run: uv sync --frozen
      - name: Lint
        working-directory: app/api
        run: uv run ruff check . && uv run ruff format --check .
      - name: Test
        working-directory: app/api
        env:
          APP_ENV: local
          DATABASE_URL: postgresql+psycopg://vora:vora@localhost:5432/vora
          REDIS_URL: redis://localhost:6379/0
          VORA_INTEGRATION: "1"
        run: uv run pytest
      - name: Migrate
        working-directory: app/api
        env:
          DATABASE_URL: postgresql+psycopg://vora:vora@localhost:5432/vora
        run: uv run alembic upgrade head

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/web/package-lock.json
      - name: Install
        working-directory: app/web
        run: npm ci
      - name: Lint
        working-directory: app/web
        run: npm run lint
      - name: Test
        working-directory: app/web
        run: npm test
      - name: Build
        working-directory: app/web
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
        run: npm run build
