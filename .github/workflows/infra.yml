name: infra

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches: [dev, main]
    paths:
      - "infra/**"
      - "voice/livekit/**"
      - ".github/workflows/infra.yml"
  push:
    branches: [dev]
    paths:
      - "infra/**"
      - "voice/livekit/**"
      - ".github/workflows/infra.yml"

concurrency:
  group: vora2-dev-infra
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha || github.sha }}
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.5"
      - name: terraform fmt
        working-directory: infra
        run: terraform fmt -check -recursive
      - name: terraform init
        working-directory: infra/envs/dev
        run: terraform init -backend=false -input=false
      - name: terraform validate
        working-directory: infra/envs/dev
        run: terraform validate -no-color

  plan:
    needs: [validate]
    if: github.event_name == 'pull_request' && github.event.action != 'closed'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    defaults:
      run:
        working-directory: infra/envs/dev
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha || github.sha }}
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.5"
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::585008088038:role/vora2-github-dev
          aws-region: ap-south-1
      - run: terraform init -input=false
      - run: terraform plan -input=false -lock-timeout=5m -no-color

  apply:
    needs: [validate]
    # Same OIDC limit as the app deploy: a merged pull request into dev can
    # assume the role, and a push to refs/heads/dev cannot.
    if: >-
      github.event_name == 'pull_request' &&
      github.event.action == 'closed' &&
      github.event.pull_request.merged == true &&
      github.event.pull_request.base.ref == 'dev' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    defaults:
      run:
        working-directory: infra/envs/dev
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.5"
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::585008088038:role/vora2-github-dev
          aws-region: ap-south-1
      - run: terraform init -input=false
      - name: Save plan
        run: terraform plan -input=false -lock-timeout=5m -no-color -out=tfplan
      - name: Apply saved plan
        run: terraform apply -input=false -lock-timeout=5m tfplan
